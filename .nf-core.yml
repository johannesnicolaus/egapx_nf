repository_type: pipeline
nf_core_version: "4.1.0"

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-egapx_logo_light.png
    - docs/images/nf-core-egapx_logo_light.png
    - docs/images/nf-core-egapx_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-egapx_logo_light.png
    - docs/images/nf-core-egapx_logo_light.png
    - docs/images/nf-core-egapx_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: johannesnicolaus
  name: egapx_nf
  description: Prepare RNA-seq evidence (rRNA removal, subsampling, name sanitising) and run NCBI EGAPx on many genomes
  author: Johannes Nicolaus Wibisana
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - gpu
    - codespaces
    - seqera_platform
  is_nfcore: false
